name: Publish Docker image

on:
  release:
    types: [published]

jobs:

  build_and_pub:

    runs-on: ubuntu-latest
    env:
      USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          submodules: 'true'
  
      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/v}"
          BASE_NAME="$USERNAME/grading-node"
          echo "CURRENT_TAG=$BASE_NAME:$VERSION_TAG" >> "$GITHUB_ENV"
          echo "LATEST_TAG=$BASE_NAME:latest" >> "$GITHUB_ENV"
          docker build --tag "$BASE_NAME:$VERSION_TAG" --tag "$BASE_NAME:latest" .

      - name: Push tagged image to docker.io
        run: |
          docker push "$CURRENT_TAG"
          docker push "$LATEST_TAG"